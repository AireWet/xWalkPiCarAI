[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xWalkJiraImport"
version = "1.0.0"
description = "Reconstruct completed Jira work items from historical xWalk GitHub commits"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.0,<3.0",
]

[project.scripts]
xWalkJiraImport = "xWalkJiraImport.xWalkJiraImportApplication:main"

[tool.setuptools]
packages = ["xWalkJiraImport"]
