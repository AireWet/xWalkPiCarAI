#!/usr/bin/env bash
# Multi-repository Gerrit configuration. Never store credentials in this file.
: "${GERRIT_SERVER_HOST:=GERRIT_SERVER_HOST_FROM_ASSESSMENT}"
: "${GERRIT_SSH_PORT:=29418}"
: "${GERRIT_HTTP_BASE_URL:=}"
: "${GERRIT_BASE_URL:=ssh://${GERRIT_SERVER_HOST}:${GERRIT_SSH_PORT}}"
: "${GERRIT_ADMIN_USERNAME:=GERRIT_ADMIN_USERNAME}"
: "${GERRIT_CI_USERNAME:=xwalk-ci}"
: "${GERRIT_OWNER_GROUP:=xWalk-Owners}"
: "${GERRIT_PARTNER_GROUP:=xWalk-Partners}"
: "${GERRIT_CI_GROUP:=xWalk-CI}"
: "${GERRIT_PARTNER_DEVNOTE_DIRECT_PUSH:=false}"
: "${GERRIT_UPLIFT_AUTO_SUBMIT:=false}"
: "${GITHUB_XWALK_RPI5_REMOTE:=}"
: "${GITHUB_XWALK_RPI5_BRANCH:=main}"
: "${GITHUB_PUSH_ENABLED:=false}"
: "${GITHUB_DIRECT_PUSH_OWNER_EMAIL:=}"
: "${XWALK_CHANGE_LOG_DIR:=$HOME/.local/state/xwalk-gerrit/change-log}"

# Optional permission-test identities. Each key must belong only to that account.
: "${GERRIT_PARTNER_USERNAME:=}"
: "${GERRIT_PARTNER_SSH_KEY:=}"
: "${GERRIT_CI_SSH_KEY:=}"
: "${GERRIT_OWNER_SSH_KEY:=}"

export GERRIT_SERVER_HOST GERRIT_SSH_PORT GERRIT_HTTP_BASE_URL
export GERRIT_BASE_URL
export GERRIT_ADMIN_USERNAME GERRIT_CI_USERNAME
export GERRIT_OWNER_GROUP GERRIT_PARTNER_GROUP GERRIT_CI_GROUP
export GERRIT_PARTNER_DEVNOTE_DIRECT_PUSH GERRIT_UPLIFT_AUTO_SUBMIT
export GITHUB_XWALK_RPI5_REMOTE GITHUB_XWALK_RPI5_BRANCH GITHUB_PUSH_ENABLED
export GITHUB_DIRECT_PUSH_OWNER_EMAIL
export XWALK_CHANGE_LOG_DIR GERRIT_PARTNER_USERNAME GERRIT_PARTNER_SSH_KEY
export GERRIT_CI_SSH_KEY GERRIT_OWNER_SSH_KEY
