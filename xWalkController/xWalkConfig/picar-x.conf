# PiCar-X controller configuration manifest.
# Included paths are relative to this file. Later values override earlier values.
deployment_config_version = 1
include = picar-x.d/resources.conf
include = picar-x.d/vehicle.conf
include = picar-x.d/hardware.conf
include = picar-x.d/voice.conf
include = picar-x.d/vision.conf
include = picar-x.d/connectivity.conf
include = picar-x.d/ai/features.conf

# Enable exactly one generic language-model provider profile.
include = picar-x.d/ai/providers/ollama.conf
# Alternatives:
# include = picar-x.d/ai/providers/openai.conf
# include = picar-x.d/ai/providers/gemini.conf
# include = picar-x.d/ai/providers/anthropic.conf
# include = picar-x.d/ai/providers/openai-compatible.conf

# Calibration commands append deployment-specific overrides below this line.
