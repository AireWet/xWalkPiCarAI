# PiCar-X calibration and grayscale defaults.
picarx_dir_servo = 0
picarx_cam_pan_servo = 0
picarx_cam_tilt_servo = 0
picarx_dir_motor = [1, 1]
# Positive values reduce the left side; negative values reduce the right side.
picarx_motor_speed_calibration = 0
# Raise only after the calibration workflow verifies direction, steering, and balance.
picarx_max_motor_output_percent = 20
# The calibration workflow owns this gate; false limits effective output to 20 percent.
picarx_calibration_verified = false
line_reference = [1000, 1000, 1000]
cliff_reference = [500, 500, 500]

# Absolute packaged-resource paths; override only with deployment-owned directories.
resource_sound_directory = /usr/share/xwalk/sounds
resource_music_directory = /usr/share/xwalk/music

# Linux hardware deployment. Do not select a gpiochip by filename order.
hardware_board = auto
hardware_i2c_device = /dev/i2c-1
hardware_gpio_device = /dev/gpiochip0
hardware_device_tree_root = /proc/device-tree
# Optional exact kernel identity checks; leave empty when not provisioned.
hardware_gpio_chip_name =
hardware_gpio_chip_label =

# Linux SPI deployment. The selected spidev node owns its chip select.
hardware_spi_device = /dev/spidev0.0
hardware_spi_speed_hz = 500000
hardware_spi_mode = 0
hardware_spi_bits_per_word = 8

# Voice, language-model, and ALSA deployment settings.
voice_vosk_library = libvosk.so
voice_vosk_model = /usr/share/vosk-model-small-en-us-0.15
voice_capture_device = default
voice_playback_device = default
voice_mixer_device = default
voice_mixer_element = PCM
voice_espeak_executable = espeak-ng
voice_espeak_voice = en
# Language-model selection for voice-chat and voice-active-car commands.
# Providers: ollama, openai, chatgpt, gemini, claude, anthropic, openai_compatible.
# Keep the API key empty for Ollama. Never commit a real cloud API key.
voice_language_model_provider = ollama
voice_language_model_endpoint = http://127.0.0.1:11434/api/chat
voice_language_model_model = qwen2.5:0.5b
voice_language_model_api_key =
voice_language_model_maximum_output_tokens = 1024
# Legacy Ollama keys remain readable for deployments that have not migrated.
voice_ollama_endpoint = http://127.0.0.1:11434/api/chat
voice_ollama_model = qwen2.5:0.5b
# Configure the deployed Ollama manifest path so Doctor can verify the model offline.
voice_ollama_model_manifest =

# Still camera deployment. Select csi or usb.
camera_connection = csi
camera_csi_executable = rpicam-still
camera_csi_device = /dev/media0
camera_usb_executable = ffmpeg
camera_usb_device = /dev/video0
camera_output = /tmp/xwalk-voice-image.jpg
