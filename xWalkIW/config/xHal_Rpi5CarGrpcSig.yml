# xWalk Firmware I2C payload interface mapping.
service:
  name: xWalkIW
  properties:
    - key: Revision
      values: [1]

interface:
  module: xWalkI2c
  mode: grpc_single_rpc

operations:
  XWALK_I2C_OPERATION_PROBE: 1
  XWALK_I2C_OPERATION_READ: 2
  XWALK_I2C_OPERATION_READ_REGISTER: 3
  XWALK_I2C_OPERATION_WRITE_REGISTER: 4

signals:
  XWALK_I2C_RPI5CAR_REQ:
    number: 0x1081
    message: XWalkI2cRequestPayload
  XWALK_I2C_RPI5CAR_CFM:
    number: 0x1082
    message: XWalkI2cConfirmPayload
  XWALK_I2C_RPI5CAR_REJ:
    number: 0x1083
    message: XWalkI2cRejectPayload
  XWALK_CONTROLLER_APP_CONFIG:
    number: 0x2081
    message: XWalkAppConfig
  XWALK_CONTROLLER_APPLICATION_ARGUMENTS:
    number: 0x2082
    message: XWalkControllerApplicationArguments
  XWALK_CONTROLLER_COMMAND_REQ:
    number: 0x2083
    message: XWalkControllerCommandRequest
  XWALK_CONTROLLER_NO_ARGUMENT_REQ:
    number: 0x2084
    message: XWalkNoArgumentRequest
  XWALK_CONTROLLER_LIFECYCLE_REQ:
    number: 0x2085
    message: XWalkLifecycleRequest
  XWALK_CONTROLLER_MOVE_REQ:
    number: 0x2086
    message: XWalkMoveRequest
  XWALK_CONTROLLER_TURN_REQ:
    number: 0x2087
    message: XWalkTurnRequest
  XWALK_CONTROLLER_CAMERA_REQ:
    number: 0x2088
