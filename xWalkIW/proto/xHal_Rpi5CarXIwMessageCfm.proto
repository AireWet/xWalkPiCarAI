/**
 * @brief Confirms successful handling of XWalkI2cRequestPayload.
 *
 * @details
 * Reports the standardized confirmation state for the corresponding request.
 */
message XWalkI2cCfmPayload
{
    option (xwalkSignal) = 0x1082;

    bytes data = 1; //@@ Bytes returned by a successful read operation in bus order.
    bool responding = 2; //@@ Indicates whether the addressed device responded to a probe.
    bool flag = 3; //@@ Indicates whether the request completed successfully.
    string message = 4; //@@ Human-readable confirmation message.
}

