syntax = "proto3";

package xwalk.iw.v1;

/******************************************************************************
 * Imports
 ******************************************************************************/

import "xHal_Rpi5CarXIwMessage.proto";

/******************************************************************************
 * Service declarations
 ******************************************************************************/

/**
 * @brief Provides one generic request-confirmation exchange for xWalk I2C.
 *
 * @details
 * The request operation selects probe, direct read, register read, or register
 * write. A successful call returns the shared confirmation payload. A rejected
 * call returns a non-OK gRPC status with rejection details.
 */
service XWalkI2cService
{
    rpc Execute(XWalkI2cRequestPayload) returns (XWalkI2cConfirmPayload);
}
