syntax = "proto3";

package xwalk.iw.v1;

/******************************************************************************
 * Imports
 ******************************************************************************/

import "google/protobuf/descriptor.proto";
import "xHal_Rpi5CarXIwEnum.proto";

/******************************************************************************
 * Message option declarations
 ******************************************************************************/

/**
 * @brief Associates an xWalk protocol message with its stable signal number.
 */
extend google.protobuf.MessageOptions
{
    uint32 xwalkSignal = 50001;
}

/******************************************************************************
 * Payload structure declarations
 ******************************************************************************/

/**
 * @brief Carries the superset of fields used by every public I2C request.
 *
 * @details
 * The selected operation determines which fields are meaningful. Probe uses
 * `address`; direct read uses `address` and `length`; register read uses
 * `address`, `register_address`, and `length`; register write uses `address`,
 * `register_address`, and `data`.
 */
message XWalkI2cRequestPayload
{
    option (xwalkSignal) = 0x1081;

    uint32 address = 1;
    uint32 register_address = 2;
    uint32 length = 3;
    bytes data = 4;
    XWalkI2cOperation operation = 5;
}

/**
 * @brief Carries the fields returned by every successful public I2C operation.
 *
 * @details
 * Read operations populate `data` in bus order. A probe populates `responding`.
 * A successful register write leaves both fields at their default values.
 */
message XWalkI2cConfirmPayload
{
    option (xwalkSignal) = 0x1082;

    bytes data = 1;
    bool responding = 2;
}

/**
 * @brief Carries the shared rejection result for every public I2C operation.
 */
message XWalkI2cRejectPayload
{
    option (xwalkSignal) = 0x1083;

    uint32 reason = 1;
    string detail = 2;
}

/**
 * @brief Stores reusable paths selected for one Controller application run.
 *
 * @details
 * Mirrors `xwalk::ctrl::XWalkAppConfig`. Paths remain empty when the caller
 * requests the application defaults.
 */
message XWalkAppConfig
{
    option (xwalkSignal) = 0x2081;

    /**
     * @brief Absolute deployment configuration selected for composition.
     */
    string configuration_file_path = 1;
    /**
     * @brief Absolute resource directory selected for file-backed services.
     */
    string resource_directory = 2;
}

/**
 * @brief Stores validated global paths and the remaining Controller command.
 *
 * @details
 * Mirrors `xwalk::ctrl::XWalkControllerApplicationArguments`.
 */
message XWalkControllerApplicationArguments
{
    option (xwalkSignal) = 0x2082;

    /**
     * @brief Command arguments after application-global options are removed.
     */
    repeated string command_arguments = 1;
    /**
     * @brief Application configuration populated from global options.
     */
    XWalkAppConfig app_config = 2;
}

/**
 * @brief Stores one classified top-level command and its CLI text.
 *
 * @details
 * Mirrors `xwalk::ctrl::XWalkControllerCommandRequest`. Command signals match
 * the `XWALK_CNTRL_*_REQ` macros in `xControllerCommand.h`.
 */
message XWalkControllerCommandRequest
{
    option (xwalkSignal) = 0x2083;

    /**
     * @brief Stable Controller command signal in range `0x2000` through `0x201F`.
     */
    uint32 command = 1;
    /**
     * @brief Original arguments consumed by command-specific request parsing.
     */
    repeated string arguments = 2;
}

/**
 * @brief Represents a Controller command that intentionally has no fields.
 *
 * @details
 * Mirrors `xwalk::ctrl::XWalkNoArgumentRequest`.
 */
message XWalkNoArgumentRequest
{
    option (xwalkSignal) = 0x2084;
}

/**
 * @brief Describes one validated start-or-stop request.
 *
 * @details
 * Mirrors `xwalk::ctrl::XWalkLifecycleRequest`.
 */
message XWalkLifecycleRequest
{
    option (xwalkSignal) = 0x2085;

    /**
     * @brief Lifecycle action selected at the application boundary.
     */
    XWalkLifecycleAction action = 1;
}

/**
 * @brief Describes one validated direct vehicle movement request.
 *
 * @details
 * Mirrors `xwalk::ctrl::XWalkMoveRequest`. Optional scalar presence lets an
 * adapter apply the C++ defaults of 50 percent and 1,000 milliseconds.
 */
message XWalkMoveRequest
{
    option (xwalkSignal) = 0x2086;

    /**
     * @brief Movement action selected at the application boundary.
     */
    XWalkMoveAction action = 1;
    /**
     * @brief Requested motor power from zero through one hundred percent.
     */
    optional double speed_percent = 2;
    /**
     * @brief Requested movement duration in milliseconds.
     */
    optional uint32 duration_ms = 3;
}

/**
 * @brief Describes one validated steering request.
 *
 * @details
 * Mirrors `xwalk::ctrl::XWalkTurnRequest`. Optional angle presence lets an
 * adapter apply the C++ default of 30 degrees.
 */
message XWalkTurnRequest
{
    option (xwalkSignal) = 0x2087;

    /**
     * @brief Direction selected at the application boundary.
     */
    XWalkTurnDirection direction = 1;
    /**
     * @brief Unsigned steering magnitude from zero through 30 degrees.
     */
    optional double angle_degrees = 2;
}

/**
 * @brief Describes one validated camera-servo request.
 *
 * @details
 * Mirrors `xwalk::ctrl::XWalkCameraRequest`.
 */
message XWalkCameraRequest
{
    option (xwalkSignal) = 0x2088;

    /**
     * @brief Camera axis selected at the application boundary.
     */
    XWalkCameraAxis axis = 1;
    /**
     * @brief Requested axis angle in degrees.
     */
    double angle_degrees = 2;
}

/**
 * @brief Describes one validated sensor request.
 *
 * @details
 * Mirrors `xwalk::ctrl::XWalkSensorRequest`.
 */
message XWalkSensorRequest
{
    option (xwalkSignal) = 0x2089;

    /**
     * @brief Sensor report selected at the application boundary.
     */
    XWalkSensorType type = 1;
}

/**
 * @brief Describes one validated named self-drive request.
 *
 * @details
 * Mirrors `xwalk::ctrl::XWalkSelfDriveRequest`.
 */
message XWalkSelfDriveRequest
{
    option (xwalkSignal) = 0x208A;

    /**
     * @brief Canonical action text with words separated by spaces.
     */
    string action = 1;
}

/**
 * @brief Describes one validated full-duplex SPI transfer request.
 *
 * @details
 * Mirrors `xwalk::ctrl::XWalkSpiRequest`.
 */
message XWalkSpiRequest
{
    option (xwalkSignal) = 0x208B;

    /**
     * @brief Non-empty transmit data containing at most 256 bytes.
     */
    bytes transmit_data = 1;
}

/**
 * @brief Describes one validated GPT-car lifecycle and input-source request.
 *
 * @details
 * Mirrors `xwalk::ctrl::XWalkGptCarRequest`. Optional image presence lets an
 * adapter apply the C++ default of enabling captured images.
 */
message XWalkGptCarRequest
{
    option (xwalkSignal) = 0x208C;

    /**
     * @brief Whether the GPT-car operation starts or stops.
     */
    XWalkLifecycleAction action = 1;
    /**
     * @brief Whether prompts are read from the keyboard instead of speech.
     */
    bool keyboard_input = 2;
    /**
     * @brief Whether captured images are included with prompts.
     */
    optional bool with_image = 3;
}

/**
 * @brief Describes one validated calibration workflow request.
 *
 * @details
 * Mirrors `xwalk::ctrl::XWalkCalibrationRequest`.
 */
message XWalkCalibrationRequest
{
    option (xwalkSignal) = 0x208D;

    /**
     * @brief Calibration workflow selected at the application boundary.
     */
    XWalkCalibrationMode mode = 1;
}

/**
 * @brief Describes one validated platform audio request.
 *
 * @details
 * Mirrors `xwalk::ctrl::XWalkSoundRequest`. Optional operation presence lets
 * an adapter apply the C++ default stop operation.
 */
message XWalkSoundRequest
{
    option (xwalkSignal) = 0x208E;

    /**
     * @brief Requested sound action.
     */
    optional XWalkSoundOperation operation = 1;
    /**
     * @brief File path for play or music, or empty text otherwise.
     */
    string file_path = 2;
    /**
     * @brief Optional volume from zero through one hundred percent.
     */
    optional double volume_percent = 3;
}

/**
 * @brief Describes one interactive servo-offset calibration operation.
 *
 * @details
 * Mirrors `xwalk::ctrl::XWalkServoCalibrationConfig`.
 */
message XWalkServoCalibrationConfig
{
    option (xwalkSignal) = 0x208F;

    /**
     * @brief Section title written before prompting.
     */
    string title = 1;
    /**
     * @brief Input prompt including the supported range.
     */
    string prompt = 2;
    /**
     * @brief Inclusive calibration minimum in degrees.
     */
    double minimum_angle_degrees = 3;
    /**
     * @brief Inclusive calibration maximum in degrees.
     */
    double maximum_angle_degrees = 4;
    /**
     * @brief Zero for steering, one for pan, or two for tilt.
     */
    uint32 servo_id = 5;
}

