site_name: xWalk Developer Notes
site_description: Architecture, PiCar-X, Gerrit, CI, and deployment notes for xWalk.
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true

validation:
  links:
    absolute_links: info
    not_found: ignore
    unrecognized_links: ignore
