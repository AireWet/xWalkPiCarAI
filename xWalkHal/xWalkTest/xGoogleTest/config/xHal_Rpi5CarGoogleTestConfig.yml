schema_version: 1

board:
  gpio_device: &gpio_device /dev/gpiochip0
  gpio_chip_name: &gpio_chip_name ""
  gpio_chip_label: &gpio_chip_label ""
  i2c_device: &i2c_device /dev/i2c-1
  spi_device: &spi_device /dev/spidev0.0
  camera_connection: &camera_connection csi
  camera_executable: &camera_executable rpicam-still
  camera_device: &camera_device /dev/video0
  camera_output: &camera_output /tmp/xwalk-camera-test.jpg
  robot_config: &robot_config /tmp/xwalk-init-angles.config
  microphone_device: default
  pcm_device: default
  mixer_device: default
  mixer_element: PCM

ai:
  ollama_endpoint: http://localhost:11434/api/chat
  ollama_model: deepseek-r1:1.5b
  vosk_library: "@XWALK_VOSK_LIBRARY_PATH@"
  vosk_model_path: "@XWALK_VOSK_MODEL_PATH@"
  api_key_environment:
    openai: OPENAI_API_KEY

hardware_tests:
  TEST_SUITE_XWALK_CAMERA:
    StillCapture:
      arguments: [*camera_connection, *camera_executable, *camera_device, *camera_output]
  TEST_SUITE_XWALK_GPIO:
    Output:
      arguments: [*gpio_device, *gpio_chip_name, *gpio_chip_label]
  TEST_SUITE_XWALK_I2C:
    Probe:
      arguments: [*i2c_device]
  TEST_SUITE_XWALK_SPI:
    Transfer:
      arguments: [*spi_device]
  TEST_SUITE_XWALK_SEQUENCE:
    ButtonEvent:
      arguments: [button-event, 30, *gpio_device, *gpio_chip_name, *gpio_chip_label]
    InitAngles:
      arguments:
        - init-angles
        - *i2c_device
        - *gpio_device
        - *gpio_chip_name
        - *gpio_chip_label
        - *robot_config
    RobotHat5Motor:
      arguments: [motor-robothat5, 1, *i2c_device]
    Motor:
      arguments: [motor, 1, *i2c_device, *gpio_device, *gpio_chip_name, *gpio_chip_label]
    ServoHat:
      arguments: [servo-hat, 1, *i2c_device, *gpio_device, *gpio_chip_name, *gpio_chip_label]
    Servo:
      arguments: [servo, 1, *i2c_device]
    Tone:
      arguments: [tone, default, default, PCM]
