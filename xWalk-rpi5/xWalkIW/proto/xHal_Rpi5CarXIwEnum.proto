syntax = "proto3";
package xwalk.iw.v1;

/******************************************************************************
 * Enumeration declarations
 ******************************************************************************/

/**
 * @brief Selects the I2C operation performed by the generic gRPC request.
 *
 * @details
 * The numeric values are stable protocol data. Each value selects which fields
 * in `XWalkI2cRequestPayload` are meaningful for one `Execute` RPC call.
 */
enum XWalkI2cOperation
{
    XWALK_I2C_OPERATION_UNSPECIFIED = 0; //@@ Selects i2c operation unspecified.
    XWALK_I2C_OPERATION_PROBE = 1; //@@ Selects i2c operation probe.
    XWALK_I2C_OPERATION_READ = 2; //@@ Selects i2c operation read.
    XWALK_I2C_OPERATION_READ_REGISTER = 3; //@@ Selects i2c operation read register.
    XWALK_I2C_OPERATION_WRITE_REGISTER = 4; //@@ Selects i2c operation write register.
}

/**
 * @brief Selects one Controller audio operation.
 *
 * @details
 * Values match `xwalk::ctrl::XWalkSoundOperation` declaration order.
 */
enum XWalkSoundOperation
{
    XWALK_SOUND_OPERATION_PLAY = 0; //@@ Plays one blocking sound-effect file.
    XWALK_SOUND_OPERATION_VOLUME = 1; //@@ Changes the shared audio volume.
    XWALK_SOUND_OPERATION_MUSIC = 2; //@@ Starts one streamed music file.
    XWALK_SOUND_OPERATION_STOP = 3; //@@ Stops current music playback.
}

/**
 * @brief Selects whether a long-running Controller operation starts or stops.
 *
 * @details
 * Values match `xwalk::ctrl::XWalkLifecycleAction` declaration order.
 */
enum XWalkLifecycleAction
{
    XWALK_LIFECYCLE_ACTION_START = 0; //@@ Starts and runs the selected operation.
    XWALK_LIFECYCLE_ACTION_STOP = 1; //@@ Stops the selected operation without starting work.
}

/**
 * @brief Selects one direct Controller vehicle movement operation.
 *
 * @details
 * Values match `xwalk::ctrl::XWalkMoveAction` declaration order.
 */
enum XWalkMoveAction
{
    XWALK_MOVE_ACTION_FORWARD = 0; //@@ Moves the vehicle forward.
    XWALK_MOVE_ACTION_BACKWARD = 1; //@@ Moves the vehicle backward.
    XWALK_MOVE_ACTION_DEMO = 2; //@@ Runs the bounded movement demonstration.
}

/**
 * @brief Selects one Controller steering direction.
 *
 * @details
 * Values match `xwalk::ctrl::XWalkTurnDirection` declaration order.
 */
enum XWalkTurnDirection
{
    XWALK_TURN_DIRECTION_LEFT = 0; //@@ Steers toward the left side.
    XWALK_TURN_DIRECTION_RIGHT = 1; //@@ Steers toward the right side.
}

/**
 * @brief Selects one Controller camera-servo axis.
 *
 * @details
 * Values match `xwalk::ctrl::XWalkCameraAxis` declaration order.
 */
enum XWalkCameraAxis
{
    XWALK_CAMERA_AXIS_PAN = 0; //@@ Selects the horizontal camera servo.
    XWALK_CAMERA_AXIS_TILT = 1; //@@ Selects the vertical camera servo.
}

/**
 * @brief Selects one Controller vehicle-sensor report.
 *
 * @details
 * Values match `xwalk::ctrl::XWalkSensorType` declaration order.
 */
enum XWalkSensorType
{
    XWALK_SENSOR_TYPE_DISTANCE = 0; //@@ Reads the ultrasonic distance in centimeters.
    XWALK_SENSOR_TYPE_GRAYSCALE = 1; //@@ Samples and reports the three grayscale channels.
}

/**
 * @brief Selects one interactive Controller calibration workflow.
 *
 * @details
 * Values match `xwalk::ctrl::XWalkCalibrationMode` declaration order.
 */
enum XWalkCalibrationMode
{
    XWALK_CALIBRATION_MODE_COMPLETE = 0; //@@ Calibrates actuators and grayscale references.
    XWALK_CALIBRATION_MODE_GRAYSCALE = 1; //@@ Calibrates only grayscale references.
    XWALK_CALIBRATION_MODE_SERVO_MOTOR = 2; //@@ Calibrates only servos and motors.
}
