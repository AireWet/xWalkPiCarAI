message XWalkSelfDriveRequest
{
    option (cxx_signal) = CXX_XWALK_SELF_DRIVE_REQ;

    string action = 1; //@@ Canonical action text with words separated by spaces.
}

/**
 * @brief Describes one validated full-duplex SPI transfer request.
 *
 * @details
