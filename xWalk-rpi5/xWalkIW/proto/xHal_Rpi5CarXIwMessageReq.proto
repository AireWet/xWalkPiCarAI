syntax = "proto3";
package xwalk.iw.v1;

/******************************************************************************
 * Imports
 ******************************************************************************/

import "google/protobuf/descriptor.proto";
import "xHal_Rpi5CarXIwEnum.proto";
import "xHal_Rpi5CarXIwSignal.proto";

/******************************************************************************
 * Message option declarations
 ******************************************************************************/

/**
 * @brief Associates an xWalk protocol message with its typed C++ signal.
 */
extend google.protobuf.MessageOptions
{
    XWalkSignalNumber cxx_signal = 50001; //@@ Typed xWalk signal associated with the message.
}

/******************************************************************************
 * Payload structure declarations
 ******************************************************************************/

/**
 * @brief Wraps one encoded xWalk request or configuration message.
 *
 * @details
 * `sig_no` identifies the concrete message type through its `(cxx_signal)`
 * option and request XML mapping. `payload` contains the complete Protobuf wire
 * encoding of that message, including all of its request or configuration
 * arguments. Receivers must validate the signal mapping before decoding.
 */
message XWalkSignal
{
    uint32 sig_no = 1; //@@ Stable signal number identifying the encoded message type.
    bytes payload = 2; //@@ Protobuf wire bytes of the request or configuration message selected by `sig_no`.
    XClientAddress client_address = 3; //@@ Address and routing identity of the client that emitted the signal.
}

/**
 * @brief Identifies the client endpoint associated with one xWalk signal.
 *
 * @details
 * Mirrors the C++ `xClientAddress` transport structure. Producers must limit
 * `client_address` so it fits the destination `XWALK_CLIENT_ADDRESS_SIZE`
 * character array, including its terminating null character.
 */
message XClientAddress
{
    uint32 mail_box_id = 1; //@@ Mailbox identifier assigned to the client endpoint.
    string client_address = 2; //@@ Client address text without fixed-buffer padding or a null terminator.
    uint32 xwalk_local_index = 3; //@@ Process-local xWalk client index used for routing.
    uint32 module_type = 4; //@@ Numeric module type associated with the client.
}

/**
 * @brief Carries the superset of fields used by every public I2C request.
 *
 * @details
 * The selected operation determines which fields are meaningful. Probe uses
 * `address`; direct read uses `address` and `length`; register read uses
 * `address`, `register_address`, and `length`; register write uses `address`,
 * `register_address`, and `data`.
 */
message XWalkI2cRequestPayload
{
    option (cxx_signal) = CXX_XWALK_I2C_REQ;

    uint32 address = 1; //@@ Target seven-bit I2C address.
    uint32 register_address = 2; //@@ Target I2C register address.
    uint32 length = 3; //@@ Requested transfer length in bytes.
    bytes data = 4; //@@ Payload bytes in transport order.
    XWalkI2cOperation operation = 5; //@@ I2C operation to perform.
}

/**
 * @brief Stores reusable paths selected for one Controller application run.
 *
 * @details
 * Mirrors `xwalk::ctrl::XWalkAppConfig`. Paths remain empty when the caller
 * requests the application defaults.
 */
message XWalkAppConfig
{
    option (cxx_signal) = CXX_XWALK_APP_CFG_REQ;

    string configuration_file_path = 1; //@@ Absolute deployment configuration selected for composition.
    string resource_directory = 2; //@@ Absolute resource directory selected for file-backed services.
}

/**
 * @brief Stores validated global paths and the remaining Controller command.
 *
 * @details
 * Mirrors `xwalk::ctrl::XWalkControllerApplicationArguments`.
 */
message XWalkControllerApplicationArguments
{
    option (cxx_signal) = CXX_XWALK_APP_ARGS_REQ;

    repeated string command_arguments = 1; //@@ Command arguments after application-global options are removed.
    XWalkAppConfig app_config = 2; //@@ Application configuration populated from global options.
}

/**
 * @brief Stores one classified top-level command and its CLI text.
 *
 * @details
 * Mirrors `xwalk::ctrl::XWalkControllerCommandRequest`. Command signals match
 * the `XWALK_CNTRL_*_REQ` macros in `xControllerCommand.h`.
 */
message XWalkControllerCommandRequest
{
    option (cxx_signal) = CXX_XWALK_CTRL_CMD_REQ;

    uint32 command = 1; //@@ Stable Controller command signal in range `0x2000` through `0x2020`.
    repeated string arguments = 2; //@@ Original arguments consumed by command-specific request parsing.
}

/**
 * @brief Represents a Controller command that intentionally has no fields.
 *
 * @details
 * Mirrors `xwalk::ctrl::XWalkNoArgumentRequest`.
 */
message XWalkNoArgumentRequest
{
    option (cxx_signal) = CXX_XWALK_NO_ARG_REQ;
}

/**
 * @brief Describes one validated start-or-stop request.
 *
 * @details
 * Mirrors `xwalk::ctrl::XWalkLifecycleRequest`.
 */
message XWalkLifecycleRequest
{
    option (cxx_signal) = CXX_XWALK_LIFECYCLE_REQ;

    XWalkLifecycleAction action = 1; //@@ Lifecycle action selected at the application boundary.
}

/**
 * @brief Describes one validated direct vehicle movement request.
 *
 * @details
 * Mirrors `xwalk::ctrl::XWalkMoveRequest`. Optional scalar presence lets an
 * adapter apply the C++ defaults of 50 percent and 1,000 milliseconds.
 */
message XWalkMoveRequest
{
    option (cxx_signal) = CXX_XWALK_MOVE_REQ;

    XWalkMoveAction action = 1; //@@ Movement action selected at the application boundary.
    optional double speed_percent = 2; //@@ Requested motor power from zero through one hundred percent.
    optional uint32 duration_ms = 3; //@@ Requested movement duration in milliseconds.
}

/**
 * @brief Describes one validated steering request.
 *
 * @details
 * Mirrors `xwalk::ctrl::XWalkTurnRequest`. Optional angle presence lets an
 * adapter apply the C++ default of 30 degrees.
 */
message XWalkTurnRequest
{
    option (cxx_signal) = CXX_XWALK_TURN_REQ;

    XWalkTurnDirection direction = 1; //@@ Direction selected at the application boundary.
    optional double angle_degrees = 2; //@@ Unsigned steering magnitude from zero through 30 degrees.
}

/**
 * @brief Describes one validated camera-servo request.
