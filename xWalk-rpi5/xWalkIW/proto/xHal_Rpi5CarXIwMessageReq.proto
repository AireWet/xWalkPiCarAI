message XWalkCameraRequest
{
    option (cxx_signal) = CXX_XWALK_CAMERA_REQ;

    XWalkCameraAxis axis = 1; //@@ Camera axis selected at the application boundary.
    double angle_degrees = 2; //@@ Requested axis angle in degrees.
}

/**
