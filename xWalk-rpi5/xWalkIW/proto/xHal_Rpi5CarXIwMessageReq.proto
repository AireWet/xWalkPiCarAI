 */
message XWalkSpiRequest
{
    option (cxx_signal) = CXX_XWALK_SPI_REQ;

    bytes transmit_data = 1; //@@ Non-empty transmit data containing at most 256 bytes.
}

/**
 * @brief Describes one validated GPT-car lifecycle and input-source request.
 *
 * @details
 * Mirrors `xwalk::ctrl::XWalkGptCarRequest`. Optional image presence lets an
 * adapter apply the C++ default of enabling captured images.
 */
message XWalkGptCarRequest
{
    option (cxx_signal) = CXX_XWALK_GPT_CAR_REQ;

    XWalkLifecycleAction action = 1; //@@ Whether the GPT-car operation starts or stops.
    bool keyboard_input = 2; //@@ Whether prompts are read from the keyboard instead of speech.
    optional bool with_image = 3; //@@ Whether captured images are included with prompts.
}

/**
 * @brief Describes one validated calibration workflow request.
 *
 * @details
 * Mirrors `xwalk::ctrl::XWalkCalibrationRequest`.
 */
message XWalkCalibrationRequest
{
    option (cxx_signal) = CXX_XWALK_CALIBRATION_REQ;

    XWalkCalibrationMode mode = 1; //@@ Calibration workflow selected at the application boundary.
}

/**
 * @brief Describes one validated platform audio request.
 *
 * @details
 * Mirrors `xwalk::ctrl::XWalkSoundRequest`. Optional operation presence lets
 * an adapter apply the C++ default stop operation.
 */
message XWalkSoundRequest
{
    option (cxx_signal) = CXX_XWALK_SOUND_REQ;

    optional XWalkSoundOperation operation = 1; //@@ Requested sound action.
    string file_path = 2; //@@ File path for play or music, or empty text otherwise.
    optional double volume_percent = 3; //@@ Optional volume from zero through one hundred percent.
}

/**
 * @brief Describes one interactive servo-offset calibration operation.
 *
 * @details
 * Mirrors `xwalk::ctrl::XWalkServoCalibrationConfig`.
 */
message XWalkServoCalibrationConfig
{
    option (cxx_signal) = CXX_XWALK_SERVO_CAL_CFG_REQ;

    string title = 1; //@@ Section title written before prompting.
    string prompt = 2; //@@ Input prompt including the supported range.
    double minimum_angle_degrees = 3; //@@ Inclusive calibration minimum in degrees.
    double maximum_angle_degrees = 4; //@@ Inclusive calibration maximum in degrees.
    uint32 servo_id = 5; //@@ Zero for steering, one for pan, or two for tilt.
}

