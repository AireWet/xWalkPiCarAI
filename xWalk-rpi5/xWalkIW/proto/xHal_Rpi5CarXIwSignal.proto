/**
 * @brief Identifies an error or warning delivered by the trace callback.
 *
 * @details
 * Numeric values match the public `XWalkTraceLevel` error and warning values.
 */
enum XWalkTraceSeverity
{
    XWALK_TRACE_SEVERITY_UNSPECIFIED = 0; //@@ Represents an absent or unrecognized trace severity.
    XWALK_TRACE_SEVERITY_ERROR = 1; //@@ Reports an error that prevents an operation.
    XWALK_TRACE_SEVERITY_WARNING = 2; //@@ Reports an unexpected condition that allows continuation.
}

/**
 * @brief Assigns stable transport numbers to public trace error selectors.
 *
 * @details
 * Values mirror `xwalk::hal::XWalkErrorSignalNumber` and remain independent of
 * platform POSIX signal numbers.
 */
enum XWalkErrorSignalNumber
{
    XWALK_ERROR_SIGNAL_UNSPECIFIED = 0; //@@ No error selector was supplied or recognized.
    XWALK_ERROR_SIGNAL_INVALID_ARGUMENT = 1; //@@ Selects an invalid-argument diagnostic.
    XWALK_ERROR_SIGNAL_OUT_OF_RANGE = 2; //@@ Selects an out-of-range diagnostic.
    XWALK_ERROR_SIGNAL_LENGTH_ERROR = 3; //@@ Selects a length-error diagnostic.
    XWALK_ERROR_SIGNAL_DOMAIN_ERROR = 4; //@@ Selects a domain-error diagnostic.
    XWALK_ERROR_SIGNAL_LOGIC_ERROR = 5; //@@ Selects a logic-error diagnostic.
    XWALK_ERROR_SIGNAL_RUNTIME_ERROR = 6; //@@ Selects a runtime-error diagnostic.
    XWALK_ERROR_SIGNAL_OVERFLOW_ERROR = 7; //@@ Selects an overflow-error diagnostic.
    XWALK_ERROR_SIGNAL_UNDERFLOW_ERROR = 8; //@@ Selects an underflow-error diagnostic.
    XWALK_ERROR_SIGNAL_SYSTEM_ERROR = 9; //@@ Selects a system-error diagnostic.
    XWALK_ERROR_SIGNAL_BAD_ALLOCATION = 10; //@@ Selects an allocation-failure diagnostic.
    XWALK_ERROR_SIGNAL_BAD_CAST = 11; //@@ Selects a bad-cast diagnostic.
    XWALK_ERROR_SIGNAL_BAD_TYPE_ID = 12; //@@ Selects a bad-type-information diagnostic.
    XWALK_ERROR_SIGNAL_BAD_FUNCTION_CALL = 13; //@@ Selects a bad-function-call diagnostic.
    XWALK_ERROR_SIGNAL_BAD_OPTIONAL_ACCESS = 14; //@@ Selects a bad-optional-access diagnostic.
    XWALK_ERROR_SIGNAL_BAD_VARIANT_ACCESS = 15; //@@ Selects a bad-variant-access diagnostic.
    XWALK_ERROR_SIGNAL_BAD_WEAK_POINTER = 16; //@@ Selects a bad-weak-pointer diagnostic.
    XWALK_ERROR_SIGNAL_STANDARD_EXCEPTION = 17; //@@ Selects a generic standard-exception diagnostic.
    XWALK_ERROR_SIGNAL_ABORT = 18; //@@ Selects a process-abort diagnostic.
    XWALK_ERROR_SIGNAL_FLOATING_POINT = 19; //@@ Selects a floating-point-exception diagnostic.
    XWALK_ERROR_SIGNAL_ILLEGAL_INSTRUCTION = 20; //@@ Selects an illegal-instruction diagnostic.
