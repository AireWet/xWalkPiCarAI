/**
 * @brief Carries an error or warning emitted through the trace callback.
 *
 * @details
 * Carries the stable selector number, callback severity, and fully formatted
 * diagnostic message. This transport-only message has no request signal binding.
 */
message XWalkTraceRej
{
    XWalkTraceSeverity severity = 1; //@@ Error or warning severity supplied to the trace callback.
    string message = 2; //@@ Fully formatted diagnostic text supplied to the trace callback.
    XWalkErrorSignalNumber error_signal = 3; //@@ Stable number identifying the public trace selector.
}

/**
 * @brief Rejects XWalkI2cRequestPayload with a reason and diagnostic detail.
 *
 * @details
 * Reports the standardized rejection state for the corresponding request.
 */
message XWalkI2cRejPayload
{
    option (cxx_signal) = CXX_XWALK_I2C_REJ;

    bytes data = 1; //@@ Bytes returned with the rejection in transport order.
    bool responding = 2; //@@ Indicates whether the addressed service or device responded.
    uint32 reason = 3; //@@ Stable numeric reason identifying why the request was rejected.
    string detail = 4; //@@ Human-readable diagnostic detail describing the rejection.
    XWalkErrorSignalNumber error_signal = 5; //@@ Stable trace error selector identifying the rejection cause.
}

