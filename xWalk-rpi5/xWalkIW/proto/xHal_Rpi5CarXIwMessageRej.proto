/**
 * @brief Rejects XWalkI2cRequestPayload with a reason and diagnostic detail.
 *
 * @details
 * Reports the standardized rejection state for the corresponding request.
 */
message XWalkI2cRejPayload
{
    option (xwalkSignal) = 0x1083;

    bytes data = 1; //@@ Bytes returned with the rejection in transport order.
    bool responding = 2; //@@ Indicates whether the addressed service or device responded.
    uint32 reason = 3; //@@ Stable numeric reason identifying why the request was rejected.
    string detail = 4; //@@ Human-readable diagnostic detail describing the rejection.
}

