# Linux hardware deployment. Do not select a gpiochip by filename order.
hardware_board = auto
hardware_i2c_device = /dev/i2c-1
hardware_gpio_device = /dev/gpiochip0
hardware_device_tree_root = /proc/device-tree
# Optional exact kernel identity checks; leave empty when not provisioned.
hardware_gpio_chip_name =
hardware_gpio_chip_label =
hardware_gpio_minimum_line_count = 28

# Robot HAT reset, sensing, and actuator wiring.
hardware_mcu_reset_pin = MCURST
hardware_mcu_reset_settle_ms = 200
hardware_battery_adc_channel = A4
hardware_pan_pwm_channel = P0
hardware_tilt_pwm_channel = P1
hardware_direction_pwm_channel = P2
hardware_ultrasonic_trigger_pin = D2
hardware_ultrasonic_echo_pin = D3
hardware_grayscale_left_channel = A0
hardware_grayscale_middle_channel = A1
hardware_grayscale_right_channel = A2
hardware_status_led_pin = LED

# Robot HAT v5 dual-PWM motor wiring.
hardware_v5_left_forward_pwm_channel = P12
hardware_v5_left_reverse_pwm_channel = P13
hardware_v5_right_forward_pwm_channel = P14
hardware_v5_right_reverse_pwm_channel = P15

# Robot HAT v4 PWM-and-direction motor wiring.
hardware_v4_left_pwm_channel = P13
hardware_v4_right_pwm_channel = P12
hardware_v4_left_direction_pin = D4
hardware_v4_right_direction_pin = D5

# Linux SPI deployment. The selected spidev node owns its chip select.
hardware_spi_device = /dev/spidev0.0
hardware_spi_speed_hz = 500000
hardware_spi_mode = 0
hardware_spi_bits_per_word = 8
