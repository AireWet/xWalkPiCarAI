# Example 19 local voice-chatbot composition.
local_voice_chatbot_piper_model = en_US-amy-low
local_voice_chatbot_ollama_endpoint = http://127.0.0.1:11434/api/chat
local_voice_chatbot_ollama_model = llama3.2:3b
local_voice_chatbot_maximum_messages = 20

# Rolly retains OpenAI; Jarvis defaults to local Ollama without a credential.
voice_active_car_api_key_environment = OPENAI_API_KEY
voice_active_car_endpoint = https://api.openai.com/v1/chat/completions
voice_active_car_model = gpt-4o-mini
voice_active_car_maximum_output_tokens = 1024
voice_active_car_gpt_provider = ollama
voice_active_car_gpt_api_key_environment =
voice_active_car_gpt_endpoint = http://127.0.0.1:11434/api/chat
voice_active_car_gpt_model = llama3.2:3b
voice_active_car_gpt_timeout_ms = 120000
voice_active_car_gpt_maximum_output_tokens = 256
voice_active_car_gpt_maximum_messages = 20
voice_active_car_gpt_piper_model = /usr/share/xwalk/models/piper/en_GB-alan-medium.onnx
voice_active_car_gpt_with_image = false
voice_active_car_gpt_continuous_conversation = true
voice_active_car_gpt_conversation_idle_timeout_ms = 30000
voice_active_car_gpt_conversation_maximum_rounds = 10
voice_active_car_gpt_conversation_maximum_misses = 3
voice_active_car_gpt_sleep_phrases = "goodbye jarvis,go to sleep,stop listening"
voice_active_car_gpt_sleep_acknowledgement = "Going to sleep. Say hey Jarvis when you need me, Joxy."
voice_active_car_gpt_web_search_enabled = true
voice_active_car_gpt_web_search_endpoint = http://127.0.0.1:8080/search
voice_active_car_gpt_web_search_maximum_results = 3
voice_active_car_gpt_web_search_timeout_ms = 5000
voice_active_car_gpt_web_search_maximum_response_bytes = 262144

# Upstream gpt_examples profile; the key is read only from OPENAI_API_KEY.
gpt_car_api_key_environment = OPENAI_API_KEY
gpt_car_endpoint = https://api.openai.com/v1/chat/completions
gpt_car_model = gpt-4o
gpt_car_maximum_output_tokens = 1024

# Example 17 image-grounded text conversation defaults.
text_vision_image_path = /tmp/llm-img.jpg
text_vision_width = 1280
text_vision_height = 720
text_vision_ollama_endpoint = http://127.0.0.1:11434/api/chat
text_vision_ollama_model = llava:7b

# Example 18 OpenAI text conversation. Credential comes from OPENAI_API_KEY.
online_llm_api_key_environment = OPENAI_API_KEY
online_llm_endpoint = https://api.openai.com/v1/chat/completions
online_llm_model = gpt-4o
