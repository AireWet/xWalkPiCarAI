# Anthropic OpenAI-compatible provider. Never commit a real API key.
voice_language_model_provider = anthropic
voice_language_model_endpoint = https://api.anthropic.com/v1/chat/completions
voice_language_model_model_environment = ANTHROPIC_MODEL
voice_language_model_api_key_environment = ANTHROPIC_API_KEY
voice_language_model_maximum_output_tokens = 1024
voice_language_model_timeout_ms = 120000
