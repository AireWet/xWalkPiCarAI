schema_version: 1

board:
  gpio_device: &gpio_device /dev/gpiochip0
  gpio_chip_name: &gpio_chip_name ""
  gpio_chip_label: &gpio_chip_label ""
  i2c_device: &i2c_device /dev/i2c-1
  camera_connection: &camera_connection csi
  camera_executable: &camera_executable rpicam-still
  camera_device: &camera_device /dev/video0
  microphone_device: &microphone_device default
  pcm_device: default
  mixer_device: default
  mixer_element: PCM

ai:
  maximum_prompts: &maximum_prompts 1
  ollama_endpoint: http://localhost:11434/api/chat
  ollama_image_endpoint: http://192.168.100.145:11434/api/chat
  generic_endpoint: &generic_endpoint https://example.invalid/v1/chat/completions
  generic_model: &generic_model deployment-model
  qwen_endpoint: https://dashscope-intl.aliyuncs.com/compatible-mode/v1/chat/completions
  vosk_library: &vosk_library "@XWALK_VOSK_LIBRARY_PATH@"
  vosk_model_path: &vosk_model_path "@XWALK_VOSK_MODEL_PATH@"
  api_key_environment:
    deepseek: DEEPSEEK_API_KEY
    doubao: DOUBAO_API_KEY
    gemini: GEMINI_API_KEY
    grok: XAI_API_KEY
    openai: OPENAI_API_KEY
    generic: OTHERS_API_KEY
    qwen: QWEN_API_KEY

examples:
  led:
    arguments: [*gpio_device, *gpio_chip_name, *gpio_chip_label]
  llm-deepseek:
    arguments: [*maximum_prompts]
  llm-doubao:
    arguments: [*maximum_prompts]
  llm-doubao-with-image:
    arguments: [*maximum_prompts, *camera_connection, *camera_executable, *camera_device]
  llm-gemini:
    arguments: [*maximum_prompts]
  llm-grok:
    arguments: [*maximum_prompts]
  llm-ollama:
    arguments: [*maximum_prompts]
  llm-ollama-with-image:
    arguments: [*maximum_prompts, *camera_connection, *camera_executable, *camera_device]
  llm-openai:
    arguments: [*maximum_prompts]
  llm-openai-with-image:
    arguments: [*maximum_prompts, *camera_connection, *camera_executable, *camera_device]
  llm-others:
    arguments: [*maximum_prompts, *generic_endpoint, *generic_model]
  llm-qwen:
    arguments: [*maximum_prompts]
  pin-input:
    arguments: [10, *gpio_device, *gpio_chip_name, *gpio_chip_label]
  ultrasonic:
    arguments: [5, *gpio_device, *gpio_chip_name, *gpio_chip_label]
  voice-assistant:
    arguments:
      - wake
      - 1
      - 5000
      - *microphone_device
      - *vosk_library
      - *vosk_model_path
      - piper
      - aplay
      - *camera_connection
      - *camera_executable
      - *camera_device
  servo:
    arguments: [1, *i2c_device]
  stt-vosk-stream:
    arguments: [1, 5000, *microphone_device, *vosk_library, *vosk_model_path]
  stt-vosk-wake-word-thread:
    arguments: [1, 10, 1000, *microphone_device, *vosk_library, *vosk_model_path]
  stt-vosk-wake-word:
    arguments: [10, 1000, *microphone_device, *vosk_library, *vosk_model_path]
  stt-vosk-without-stream:
    arguments: [1, 5000, *microphone_device, *vosk_library, *vosk_model_path]
  tts-edge:
    arguments: [edge-playback]
  tts-espeak:
    arguments: [espeak-ng]
  tts-openai:
    arguments: [mpv]
  tts-pico2wave:
    arguments: [pico2wave, aplay]
  tts-piper:
    arguments: [piper, aplay]
