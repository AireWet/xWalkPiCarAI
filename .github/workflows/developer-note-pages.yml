name: xWalk Developer Notes Pages

on:
  push:
    branches: [master]
    paths:
      - devloper-note
      - devloper-note/**
      - xWalkTool/doc-tool/**
      - .github/workflows/developer-note-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: xwalk-developer-notes-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Configure the Gerrit component identity
        env:
          GERRIT_KEY: ${{ secrets.GERRIT_SUBMODULE_SSH_KEY }}
          GERRIT_KNOWN_HOSTS: ${{ secrets.GERRIT_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/xwalk-gerrit"
          printf '%s' "$GERRIT_KEY" > "$RUNNER_TEMP/xwalk-gerrit/id_ed25519"
          printf '%s\n' "$GERRIT_KNOWN_HOSTS" > "$RUNNER_TEMP/xwalk-gerrit/known_hosts"
      - name: Check out the exact Gerrit documentation component
        env:
          GERRIT_SUBMODULE_SSH_KEY_FILE: ${{ runner.temp }}/xwalk-gerrit/id_ed25519
          GERRIT_SSH_KNOWN_HOSTS_FILE: ${{ runner.temp }}/xwalk-gerrit/known_hosts
          GERRIT_SUBMODULE_USERNAME: ${{ vars.GERRIT_SUBMODULE_USERNAME }}
          GERRIT_SERVER_HOST: ${{ vars.GERRIT_SERVER_HOST }}
          GERRIT_SSH_PORT: ${{ vars.GERRIT_SSH_PORT }}
        run: xWalkTool/shell-agent/gerrit-tool/checkout-gerrit-submodules.sh
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Build the Gerrit-approved developer-note wiki
        env:
          XWALK_WIKI_GITHUB_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: xWalkTool/doc-tool/wiki.sh verify --site-url "$XWALK_WIKI_GITHUB_URL"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build-devloper-note-wiki/github-site
      - name: Remove temporary Gerrit credentials
        if: always()
        run: rm -f -- "$RUNNER_TEMP/xwalk-gerrit/id_ed25519" "$RUNNER_TEMP/xwalk-gerrit/known_hosts"

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the approved documentation artifact
        id: deployment
        uses: actions/deploy-pages@v5
