name: xWalk Developer Notes Artifact

on:
  push:
    branches: [master]
    paths:
      - devloper-note
      - devloper-note/**
      - xWalk-rpi5-tool/doc-tool/**
      - .github/actions/checkout-private-submodules/**
      - .github/workflows/developer-note-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xwalk-developer-notes-artifact
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Validate the integrated repository metadata
        uses: ./.github/actions/checkout-private-submodules
        with:
          key-bundle: ${{ secrets.TARS_SUBMODULE_READ_KEYS }}
          supplemental-key-bundle: ${{ secrets.TARS_SUBMODULE_READ_KEYS_SUPPLEMENT }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build the Gerrit-approved developer-note wiki
        env:
          XWALK_WIKI_GITHUB_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/
          XWALK_WIKI_GITHUB_SOURCE_REPOSITORY: https://github.com/${{ github.repository }}
          XWALK_WIKI_GITHUB_SOURCE_REVISION: ${{ github.sha }}
        run: xWalk-rpi5-tool/doc-tool/wiki.sh verify --site-url "$XWALK_WIKI_GITHUB_URL"
      - uses: actions/upload-artifact@v6
        with:
          name: xwalk-developer-note-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-devloper-note-wiki/github-site
          if-no-files-found: error
          retention-days: 30
