name: xWalk Auto-assign Issues

on:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: write

jobs:
  assign-maintainer:
    name: Assign repository maintainer
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Assign the new issue to the maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: gh issue edit "${ISSUE_URL}" --add-assignee jochuuu
