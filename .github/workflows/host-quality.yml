name: xWalk Host Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: xWalk Shell Script Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install shell and CI metadata validators
        run: sudo apt-get update && sudo apt-get install --yes ansible-core python3-yaml shellcheck
      - name: Analyze every repository-owned shell script
        run: xWalkTool/shell-agent/gerrit-tool/run-host-ci-job.sh shellcheck

  deployment-scripts:
    name: xWalk Deployment Script Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install script validation dependencies
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Validate deployment scripts
        run: xWalkTool/shell-agent/gerrit-tool/run-host-ci-job.sh deployment-scripts

  build-and-test:
    name: xWalk Build & Test (${{ matrix.compiler }}, ${{ matrix.build_type }})
    needs:
      - shellcheck
      - deployment-scripts
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v6
      - name: Install host dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          clang libclang-rt-18-dev cmake ninja-build libasound2-dev libcurl4-openssl-dev
          libgmock-dev libgtest-dev libjson-c-dev libopencv-dev libtinyxml2-dev libyaml-cpp-dev python3-nacl
          protobuf-compiler protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev
      - name: Configure, build, test, and diagnose xWalk
        run: >-
          xWalkTool/shell-agent/gerrit-tool/run-host-ci-job.sh build-and-test
          ${{ matrix.compiler }} ${{ matrix.build_type }}

  asan-ubsan:
    name: xWalk Address & Undefined Behavior Sanitizers
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install host dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          cmake ninja-build libasound2-dev libcurl4-openssl-dev
          libgmock-dev libgtest-dev libjson-c-dev libopencv-dev libtinyxml2-dev libyaml-cpp-dev python3-nacl
          protobuf-compiler protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev
      - name: Build and test with AddressSanitizer and UndefinedBehaviorSanitizer
        run: xWalkTool/shell-agent/gerrit-tool/run-host-ci-job.sh asan-ubsan

  leak-sanitizer:
    name: xWalk Leak Sanitizer
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install host dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes clang cmake ninja-build
          libasound2-dev libcurl4-openssl-dev libgmock-dev libgtest-dev libjson-c-dev libopencv-dev
          libtinyxml2-dev libyaml-cpp-dev python3-nacl protobuf-compiler
          protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev
      - name: Verify LSan and run the leak-enabled suite
        run: xWalkTool/shell-agent/gerrit-tool/run-host-ci-job.sh leak-sanitizer

  thread-sanitizer:
    name: xWalk Thread Sanitizer
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install host dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          cmake ninja-build libasound2-dev libcurl4-openssl-dev
          libgmock-dev libgtest-dev libjson-c-dev libopencv-dev libtinyxml2-dev libyaml-cpp-dev python3-nacl
          protobuf-compiler protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev
      - name: Verify TSan and run focused concurrency tests
        run: xWalkTool/shell-agent/gerrit-tool/run-host-ci-job.sh thread-sanitizer

  stress-tests:
    name: xWalk Host Stress Tests
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install host dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          cmake ninja-build libasound2-dev libcurl4-openssl-dev
          libgmock-dev libgtest-dev libjson-c-dev libopencv-dev libtinyxml2-dev libyaml-cpp-dev python3-nacl
          protobuf-compiler protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev
      - name: Repeat every host test until failure
        run: xWalkTool/shell-agent/gerrit-tool/run-host-ci-job.sh stress-tests

  recorded-scenarios:
    name: xWalk Recorded Vision Scenarios
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install host dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes cmake ninja-build
          libasound2-dev libcurl4-openssl-dev libgmock-dev libgtest-dev libjson-c-dev libopencv-dev
          libtinyxml2-dev libyaml-cpp-dev python3-nacl protobuf-compiler
          protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev
      - name: Build and verify recorded scenarios
        run: xWalkTool/shell-agent/gerrit-tool/run-host-ci-job.sh recorded-scenarios

  streaming:
    name: xWalk Video Streaming Tests
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install host dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes cmake ninja-build
          libasound2-dev libcurl4-openssl-dev libgmock-dev libgtest-dev libjson-c-dev libopencv-dev
          libtinyxml2-dev libyaml-cpp-dev python3-nacl protobuf-compiler
          protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev
      - name: Build and run loopback HTTP and MJPEG lifecycle tests
        run: xWalkTool/shell-agent/gerrit-tool/run-host-ci-job.sh streaming

  fuzz-smoke:
    name: xWalk Fuzz Smoke Tests
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install fuzz dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes clang cmake ninja-build
          libasound2-dev libcurl4-openssl-dev libjson-c-dev libopencv-dev
          libtinyxml2-dev libyaml-cpp-dev python3-nacl protobuf-compiler
          protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev
      - name: Build and run bounded fuzz smoke
        run: xWalkTool/shell-agent/gerrit-tool/run-host-ci-job.sh fuzz-smoke

  soak-smoke:
    name: xWalk Robot HAT Soak Test
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install host dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes cmake ninja-build
          libasound2-dev libcurl4-openssl-dev libgmock-dev libgtest-dev libjson-c-dev libopencv-dev
          libtinyxml2-dev libyaml-cpp-dev python3-nacl protobuf-compiler
          protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev
      - name: Build, run, and validate deterministic soak smoke
        run: xWalkTool/shell-agent/gerrit-tool/run-host-ci-job.sh soak-smoke

  static-analysis:
    name: xWalk Static Analysis
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install analysis dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          cmake ninja-build clang-tidy cppcheck libasound2-dev libcurl4-openssl-dev
          libgmock-dev libgtest-dev libjson-c-dev libopencv-dev libtinyxml2-dev libyaml-cpp-dev python3-nacl
          protobuf-compiler protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev
      - name: Run Clang-Tidy and Cppcheck
        run: xWalkTool/shell-agent/gerrit-tool/run-host-ci-job.sh static-analysis

  coverage:
    name: xWalk Code Coverage
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install coverage dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          clang llvm cmake ninja-build gcovr libasound2-dev libcurl4-openssl-dev
          libgmock-dev libgtest-dev libjson-c-dev libopencv-dev libtinyxml2-dev libyaml-cpp-dev python3-nacl
          protobuf-compiler protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev
      - name: Build, test, and generate GCC and Clang coverage reports
        run: xWalkTool/shell-agent/gerrit-tool/run-host-ci-job.sh coverage
      - uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: |
            build-host/coverage/coverage.html
            build-host/coverage/coverage.*.html
            build-host/coverage/coverage.xml
            build-host/coverage/coverage.json
            build-host/coverage-clang/coverage-summary.txt
            build-host/coverage-clang/coverage.json
            build-host/coverage-clang/html

  valgrind:
    name: xWalk Valgrind Analysis
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install host and Valgrind dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes cmake ninja-build valgrind
          libasound2-dev libcurl4-openssl-dev libgmock-dev libgtest-dev libjson-c-dev libopencv-dev
          libtinyxml2-dev libyaml-cpp-dev python3-nacl protobuf-compiler
          protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev
      - name: Validate descriptors and run focused CTest MemCheck suite
        run: xWalkTool/shell-agent/gerrit-tool/run-host-ci-job.sh valgrind

  clang-static-analyzer:
    name: xWalk Clang Static Analyzer
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install host and analyzer dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes clang clang-tools libclang-rt-18-dev cmake ninja-build
          libasound2-dev libcurl4-openssl-dev libgmock-dev libgtest-dev libjson-c-dev libopencv-dev
          libtinyxml2-dev libyaml-cpp-dev python3-nacl protobuf-compiler
          protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev
      - name: Run Clang Static Analyzer
        run: xWalkTool/shell-agent/gerrit-tool/run-host-ci-job.sh clang-static-analyzer
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: clang-static-analyzer-report
          path: build-host/clang-analyzer/reports
          if-no-files-found: ignore

  staged-install:
    name: xWalk Staged Installation
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install host dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          cmake ninja-build libasound2-dev libcurl4-openssl-dev
          libgmock-dev libgtest-dev libjson-c-dev libopencv-dev libtinyxml2-dev libyaml-cpp-dev python3-nacl
          protobuf-compiler protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev
      - name: Build and verify the staged installation
        run: xWalkTool/shell-agent/gerrit-tool/run-host-ci-job.sh staged-install
      - uses: actions/upload-artifact@v6
        with:
          name: staged-install-checksums
          path: build-host/deploy.sha256

  host-quality-gate:
    name: xWalk Host Quality Gate
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - build-and-test
      - asan-ubsan
      - leak-sanitizer
      - thread-sanitizer
      - stress-tests
      - recorded-scenarios
      - streaming
      - fuzz-smoke
      - soak-smoke
      - static-analysis
      - coverage
      - valgrind
      - clang-static-analyzer
      - shellcheck
      - deployment-scripts
      - staged-install

    steps:
      - name: Verify all xWalk Host Quality jobs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$JOB_RESULTS" | jq .

          if ! printf '%s\n' "$JOB_RESULTS" |
              jq --exit-status 'all(.[]; .result == "success")' >/dev/null; then
              echo "::error::One or more xWalk Host Quality jobs did not succeed."
              exit 1
          fi

          echo "All xWalk Host Quality jobs completed successfully."
