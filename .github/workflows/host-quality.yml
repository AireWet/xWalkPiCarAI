name: Host quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v6
      - name: Install host dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          clang libclang-rt-18-dev cmake ninja-build libasound2-dev libcurl4-openssl-dev
          libgmock-dev libgtest-dev libjson-c-dev libopencv-dev libtinyxml2-dev libyaml-cpp-dev python3-nacl
          protobuf-compiler protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then
              echo "CC=clang" >> "$GITHUB_ENV"
              echo "CXX=clang++" >> "$GITHUB_ENV"
          else
              echo "CC=gcc" >> "$GITHUB_ENV"
              echo "CXX=g++" >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: >-
          cmake --fresh -S .
          -B build-host/ci-${{ matrix.compiler }}-${{ matrix.build_type }}
          -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DXWALK_ENABLE_STRICT_WARNINGS=ON
      - name: Build
        run: >-
          cmake --build build-host/ci-${{ matrix.compiler }}-${{ matrix.build_type }}
          --parallel
      - name: Test
        run: >-
          ctest --test-dir build-host/ci-${{ matrix.compiler }}-${{ matrix.build_type }}
          --output-on-failure --no-tests=error
      - name: Validate deployment configuration without hardware
        run: >-
          build-host/ci-${{ matrix.compiler }}-${{ matrix.build_type }}/xWalk-rpi5/xWalkController/xWalkApp/xwalk-picarx-control
          --deployment-config="$PWD/xWalk-rpi5/xWalkController/xWalkConfig/picar-x.conf" --diagnose --no-hardware
      - name: Test xWalkAgent aggregate
        run: >-
          ctest --test-dir build-host/ci-${{ matrix.compiler }}-${{ matrix.build_type }}
          --output-on-failure --no-tests=error -L agent-aggregate
      - name: Test xWalkAgent functional groups
        run: >-
          ctest --test-dir build-host/ci-${{ matrix.compiler }}-${{ matrix.build_type }}
          --output-on-failure --no-tests=error -L agent-group
      - name: Test simulator scenarios
        run: >-
          ctest --test-dir build-host/ci-${{ matrix.compiler }}-${{ matrix.build_type }}
          --output-on-failure --no-tests=error -L simulation
      - name: Test recorded vision scenarios
        run: >-
          ctest --test-dir build-host/ci-${{ matrix.compiler }}-${{ matrix.build_type }}
          --output-on-failure --no-tests=error -L recorded-media
      - name: Test streaming lifecycle and backpressure
        run: >-
          ctest --test-dir build-host/ci-${{ matrix.compiler }}-${{ matrix.build_type }}
          --output-on-failure --no-tests=error -L streaming
      - name: Test host-safe HAL sequences
        run: >-
          build-host/ci-${{ matrix.compiler }}-${{ matrix.build_type }}/xGoogleTest
          TEST_SUITE_XWALK_SEQUENCE:1 --gtest_brief=1
      - name: Test centralized CLI controller cases
        run: >-
          build-host/ci-${{ matrix.compiler }}-${{ matrix.build_type }}/xCliGoogleTest
          --gtest_brief=1
      - name: Test CLI controller-to-HAL sequences
        run: >-
          build-host/ci-${{ matrix.compiler }}-${{ matrix.build_type }}/xCliSequenceTest
          --gtest_brief=1

  asan-ubsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install host dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          cmake ninja-build libasound2-dev libcurl4-openssl-dev
          libgmock-dev libgtest-dev libjson-c-dev libopencv-dev libtinyxml2-dev libyaml-cpp-dev python3-nacl
          protobuf-compiler protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev
      - name: Build and test with AddressSanitizer and UndefinedBehaviorSanitizer
        run: xWalkTool/shell/run-host-sanitizer.sh asan

  leak-sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install host dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes clang cmake ninja-build
          libasound2-dev libcurl4-openssl-dev libgmock-dev libgtest-dev libjson-c-dev libopencv-dev
          libtinyxml2-dev libyaml-cpp-dev python3-nacl protobuf-compiler
          protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev
      - name: Verify LSan and run the leak-enabled suite
        run: xWalkTool/shell/run-host-sanitizer.sh lsan

  thread-sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install host dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          cmake ninja-build libasound2-dev libcurl4-openssl-dev
          libgmock-dev libgtest-dev libjson-c-dev libopencv-dev libtinyxml2-dev libyaml-cpp-dev python3-nacl
          protobuf-compiler protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev
      - name: Verify TSan and run focused concurrency tests
        run: xWalkTool/shell/run-host-sanitizer.sh tsan

  stress-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install host dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          cmake ninja-build libasound2-dev libcurl4-openssl-dev
          libgmock-dev libgtest-dev libjson-c-dev libopencv-dev libtinyxml2-dev libyaml-cpp-dev python3-nacl
          protobuf-compiler protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev
      - name: Configure strict host build
        run: cmake --fresh --preset sanity
      - name: Build
        run: cmake --build --preset sanity --parallel
      - name: Repeat every host test until failure
        run: ctest --preset host-stress

  recorded-scenarios:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install host dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes cmake ninja-build
          libasound2-dev libcurl4-openssl-dev libgmock-dev libgtest-dev libjson-c-dev libopencv-dev
          libtinyxml2-dev libyaml-cpp-dev python3-nacl protobuf-compiler
          protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev
      - name: Configure and build recorded scenarios
        run: >-
          cmake --fresh --preset host-debug && cmake --build --preset host-debug
          --target xWalkComputerVisionOpenCvHostTest xWalkVideoRecordingOpenCvHostTest xWalkRoadUserSafetyTest
          --parallel
      - name: Verify asset checksums, licenses, annotations, and decoding
        run: ctest --preset host-debug -L recorded-media

  streaming:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install host dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes cmake ninja-build
          libasound2-dev libcurl4-openssl-dev libgmock-dev libgtest-dev libjson-c-dev libopencv-dev
          libtinyxml2-dev libyaml-cpp-dev python3-nacl protobuf-compiler
          protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev
      - name: Configure and build socket streaming tests
        run: cmake --fresh --preset host-debug && cmake --build --preset host-debug --target xWalkVideoStreamingTest --parallel
      - name: Run loopback HTTP and MJPEG lifecycle tests
        run: ctest --preset host-debug -L streaming

  fuzz-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install fuzz dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes clang cmake ninja-build
          libasound2-dev libcurl4-openssl-dev libjson-c-dev libopencv-dev
          libtinyxml2-dev libyaml-cpp-dev python3-nacl protobuf-compiler
          protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev
      - name: Configure and build fuzzers
        run: cmake --fresh --preset fuzz && cmake --build --preset fuzz --parallel
      - name: Run bounded fuzz smoke
        run: >-
          for fuzz_name in configuration protobuf grpc http_requests camera_sources model_metadata scenarios i2c_payloads image_decode; do
          build-host/fuzz/xWalkTool/fuzz/xWalkFuzz_${fuzz_name} -runs=1000 -artifact_prefix=/tmp/xwalk-fuzz-
          xWalkTool/fuzz/corpus/${fuzz_name} || exit 1; done

  soak-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install host dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes cmake ninja-build
          libasound2-dev libcurl4-openssl-dev libgmock-dev libgtest-dev libjson-c-dev libopencv-dev
          libtinyxml2-dev libyaml-cpp-dev python3-nacl protobuf-compiler
          protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev
      - name: Configure and build soak test
        run: cmake --fresh --preset host-debug && cmake --build --preset host-debug --target xWalkRobotHatSoakTest --parallel
      - name: Run deterministic soak smoke
        run: ctest --preset host-debug -L soak
      - name: Validate soak report
        run: python3 -m json.tool build-host/cmake/xWalk-rpi5/xWalkHal/simulation/xWalkRobotHat/xwalk-robot-hat-soak-report.json

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install analysis dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          cmake ninja-build clang-tidy cppcheck libasound2-dev libcurl4-openssl-dev
          libgmock-dev libgtest-dev libjson-c-dev libopencv-dev libtinyxml2-dev libyaml-cpp-dev python3-nacl
          protobuf-compiler protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev
      - name: Configure
        run: cmake --fresh --preset clang-tidy
      - name: Run Clang-Tidy while building
        run: cmake --build --preset clang-tidy --parallel
      - name: Run Cppcheck
        run: cmake --build build-host/clang-tidy --target cppcheck

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install coverage dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          clang llvm cmake ninja-build gcovr libasound2-dev libcurl4-openssl-dev
          libgmock-dev libgtest-dev libjson-c-dev libopencv-dev libtinyxml2-dev libyaml-cpp-dev python3-nacl
          protobuf-compiler protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev
      - name: Build, test, and generate GCC coverage reports
        run: xWalkTool/shell/run-host-coverage.sh run gcc
      - name: Build, test, and generate Clang coverage reports
        run: xWalkTool/shell/run-host-coverage.sh run clang
      - uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: |
            build-host/coverage/coverage.html
            build-host/coverage/coverage.*.html
            build-host/coverage/coverage.xml
            build-host/coverage/coverage.json
            build-host/coverage-clang/coverage-summary.txt
            build-host/coverage-clang/coverage.json
            build-host/coverage-clang/html

  valgrind:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install host and Valgrind dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes cmake ninja-build valgrind
          libasound2-dev libcurl4-openssl-dev libgmock-dev libgtest-dev libjson-c-dev libopencv-dev
          libtinyxml2-dev libyaml-cpp-dev python3-nacl protobuf-compiler
          protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev
      - name: Test Valgrind descriptor classification
        run: xWalkTool/shell/test/validate-valgrind-descriptors-test.sh
      - name: Run focused CTest MemCheck suite
        run: xWalkTool/shell/run-host-valgrind.sh

  clang-static-analyzer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install host and analyzer dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes clang clang-tools libclang-rt-18-dev cmake ninja-build
          libasound2-dev libcurl4-openssl-dev libgmock-dev libgtest-dev libjson-c-dev libopencv-dev
          libtinyxml2-dev libyaml-cpp-dev python3-nacl protobuf-compiler
          protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev
      - name: Run Clang Static Analyzer
        run: xWalkTool/shell/run-clang-static-analyzer.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: clang-static-analyzer-report
          path: build-host/clang-analyzer/reports
          if-no-files-found: ignore

  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Analyze every repository-owned shell script
        run: xWalkTool/shell/run-host-shellcheck.sh

  deployment-scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install script validation dependencies
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Check shell scripts
        run: shellcheck xWalkTool/shell/*.sh xWalkTool/deployment/*.sh xWalkTool/deployment/test/*.sh
      - name: Test provisioning behavior
        run: bash xWalkTool/deployment/test/setup-rpi-test.sh

  staged-install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install host dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          cmake ninja-build libasound2-dev libcurl4-openssl-dev
          libgmock-dev libgtest-dev libjson-c-dev libopencv-dev libtinyxml2-dev libyaml-cpp-dev python3-nacl
          protobuf-compiler protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev
      - name: Configure release installation
        run: >-
          cmake --fresh -S . -B build-host/install -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
      - name: Build
        run: cmake --build build-host/install --parallel
      - name: Stage exact system layout
        run: DESTDIR="$PWD/build-host/deploy" cmake --install build-host/install
      - name: Verify staged resources and executable
        run: |
          test -x build-host/deploy/usr/bin/xwalk-picarx-control
          test -x build-host/deploy/usr/lib/xwalk/xWalkTool/shell/xWalkEnv.sh
          test -x build-host/deploy/usr/lib/xwalk/xWalkTool/python/xWalkLicenseTool
          test -r build-host/deploy/usr/lib/xwalk/xWalkTool/environment/xWalkLicense.cfg
          test ! -e build-host/deploy/usr/lib/xwalk/xWalkLibrary/X_WALK_LICENSE.KEY
          test -r build-host/deploy/etc/xwalk/picar-x.conf
          test -r build-host/deploy/etc/xwalk/picar-x.d/hardware.conf
          test -r build-host/deploy/etc/xwalk/picar-x.d/ai/providers/gemini.conf
          test -r build-host/deploy/usr/lib/xwalk/libvosk.so
          test -r build-host/deploy/usr/share/xwalk/models/vosk/vosk-model-small-en-us-0.15/am/final.mdl
          test -r build-host/deploy/usr/share/xwalk/sounds/car-double-horn.wav
          test -r build-host/deploy/usr/share/xwalk/sounds/car-start-engine.wav
          test -r build-host/deploy/usr/share/xwalk/music/slow-trail-Ahjay_Stelino.mp3
          cd /tmp
          "$GITHUB_WORKSPACE/build-host/deploy/usr/bin/xwalk-picarx-control" --help
          "$GITHUB_WORKSPACE/build-host/deploy/usr/bin/xwalk-picarx-control" --deployment-config="$GITHUB_WORKSPACE/build-host/deploy/etc/xwalk/picar-x.conf" --diagnose --no-hardware
      - name: Reject developer paths in installed configuration
        run: >-
          if grep -R --fixed-strings "$GITHUB_WORKSPACE"
          build-host/deploy/etc build-host/deploy/usr/share/xwalk/config; then exit 1; fi
      - name: Inspect linked libraries
        run: ldd build-host/deploy/usr/bin/xwalk-picarx-control
      - name: Reject unsafe installed permissions
        run: test -z "$(find build-host/deploy -type f -perm /022 -print -quit)"
      - name: Record staged artifact checksums
        run: >-
          find build-host/deploy -type f -print0 | sort -z |
          xargs -0 sha256sum > build-host/deploy.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: staged-install-checksums
          path: build-host/deploy.sha256
